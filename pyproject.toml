[project]
name = "tuxtoys"
version = "0.5.0.dev0"
description = "Power-user utilities for Linux Mint Cinnamon"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# Linux Mint 22 ships Python 3.12, LMDE 7 ships 3.13.
requires-python = ">=3.12"
# Runtime dependencies (PyGObject, GTK 3, XApp, libnotify) come from Debian packages, never
# from PyPI, so none are listed here.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # syntax of the oldest supported Python
    "B",            # likely bugs
    "SIM", "C4",    # simpler forms
    "DTZ",          # no naive datetimes
    "ANN",          # type hints everywhere
    "PT",           # pytest style
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the package from the checkout, so they run without installing it, and
# with the pytest Debian ships as well as the pinned one.
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra"]
